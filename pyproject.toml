[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skala_rag"]

[project]
name = "skala-10-team6"
version = "0.1.0"
description = "KV cache 최적화 기술(KIVI, InfiniGen)을 네 관점으로 평가하는 Supervisor 패턴 멀티 에이전트 보고서 생성기"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # graph and LLM calls
    "langgraph>=1.0.1",
    "langchain>=1.0.2",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.1",
    "pydantic>=2.0",
    "python-dotenv>=1.2.1",
    # paper RAG: PDF parsing, chunking, embeddings, FAISS index
    "pymupdf>=1.28.2",
    "langchain-text-splitters>=1.0.0",
    "langchain-community>=0.3.31",
    "sentence-transformers>=5.1.1",
    "transformers>=4.40.0",
    "faiss-cpu>=1.12.0",
    # web evidence
    "langchain-tavily>=0.2.12",
    # report (HTML template, PDF)
    "jinja2>=3.1.0",
    "reportlab>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
